<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from The Keeper</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#05080c"/><path d="M40 40H1160M40 347H1160" stroke="#f6ada2" stroke-opacity=".8"/><path d="M320 40V347" stroke="#f6ada2" stroke-opacity=".55"/><text x="55" y="67" fill="#f6ada2" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#ffd27a" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#f6ada2" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#ffd27a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#ffd27a"/> --><text x="180" y="191" text-anchor="middle" fill="#ffd27a" font-family="Georgia,serif" font-size="54" font-style="italic">K</text><text x="55" y="281" fill="#ece7dc" font-family="Georgia,serif" font-style="italic" font-size="22">Keeper’s Quarters</text><text x="55" y="307" fill="#f6ada2" font-family="Arial,sans-serif" font-size="11">The first room beneath the</text><text x="55" y="325" fill="#f6ada2" font-family="Arial,sans-serif" font-size="11">light.</text><path d="M600 40V347" stroke="#f6ada2" stroke-opacity=".55"/><text x="335" y="67" fill="#f6ada2" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#ffd27a" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#f6ada2" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#ffd27a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#ffd27a"/> --><text x="460" y="191" text-anchor="middle" fill="