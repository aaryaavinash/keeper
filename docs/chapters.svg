alic">L</text><text x="895" y="281" fill="#ece7dc" font-family="Georgia,serif" font-style="italic" font-size="22">The Lamp Room</text><text x="895" y="307" fill="#f6ada2" font-family="Arial,sans-serif" font-size="11">The tower’s final, warm level.</text></svg>